<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a33"/>
      <stop offset="1" stop-color="#05030f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="120" y="138" width="272" height="250" rx="44"/>
    <line x1="120" y1="212" x2="392" y2="212"/>
    <line x1="190" y1="104" x2="190" y2="160"/>
    <line x1="322" y1="104" x2="322" y2="160"/>
  </g>
  <g filter="url(#glow)" fill="#e8fdff">
    <circle cx="196" cy="276" r="16"/>
    <circle cx="256" cy="276" r="16"/>
    <circle cx="316" cy="276" r="16" fill="#ff8af0"/>
    <circle cx="196" cy="332" r="16"/>
    <circle cx="256" cy="332" r="16"/>
  </g>
</svg>
