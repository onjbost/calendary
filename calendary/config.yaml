name: Calendary
version: "0.9.0"
slug: calendary
description: Calendario, promemoria, obiettivi con routine, matrice di Eisenhower, assistente e Alexa in stile neon
url: https://calendary.gattucciocloud.it
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
# Speak on the Echo devices through Home Assistant (Alexa Devices notify entities)
homeassistant_api: true
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Interfaccia web Calendary
webui: "http://[HOST]:[PORT:8787]/"
panel_icon: mdi:calendar-star
options:
  password: ""
  api_token: ""
  mcp_token: ""
  moveo_url: "http://local-moveo:8788"
  moveo_public_url: "https://moveo.gattucciocloud.it"
  weather_entity: "weather.forecast_home"
  public_url: "https://calendary.gattucciocloud.it"
  timezone: "Europe/Rome"
  ics_sync_minutes: 15
  morning_summary: "07:30"
  ai_base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  ai_api_key: ""
  ai_model: "gemini-2.5-flash"
  ai_fallback_models: "gemini-2.5-flash-lite"
  alexa_skill_id: ""
  alexa_client_id: ""
  alexa_client_secret: ""
  alexa_reminders: important
  alexa_announce_service: ""
schema:
  password: password
  api_token: password?
  mcp_token: password
  moveo_url: str?
  moveo_public_url: str?
  weather_entity: str?
  public_url: url
  timezone: str
  ics_sync_minutes: int(5,1440)
  morning_summary: str?
  ai_base_url: url?
  ai_api_key: password?
  ai_model: str?
  ai_fallback_models: str?
  alexa_skill_id: str
  alexa_client_id: str
  alexa_client_secret: password
  alexa_reminders: list(off|important|all)
  alexa_announce_service: str
